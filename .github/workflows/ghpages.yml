name: Update Editor's Copy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: github-pages

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: martinthomson/i-d-template@v1
        with:
          make: latest
      - run: |
          mkdir site
          cp draft-sharma-moq-trace-context.{html,txt} site/
          cp site/draft-sharma-moq-trace-context.html site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
