name: Update Editor's Copy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: github-pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: martinthomson/i-d-template@v1
        with:
          make: latest
      - run: |
          mkdir site
          cp draft-sharma-moq-trace-context.{html,txt} site/
          cp site/draft-sharma-moq-trace-context.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
